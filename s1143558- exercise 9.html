<!DOCTYPE html>
<html>
<head>
<style>

.primary-heading {
  border: double;
  border-color: red;
  background-color: powderblue;
}

.secondary-heading{ 
  border:2px solid dodgerblue;
  border-radius: 5px;
  background-color: yellow;
}

.tertiary-heading{
  border-style: dotted solid;
  border-color: gray;
  background-color: mediumseagreen;
}

</style>
</head>
<body>


<h3 class = "primary-heading">Hello World</h3>
<h3 class = "secondary-heading">Hello World</h3>
<h3 class = "tertiary-heading">Hello World</h3>

</body>
</html>
