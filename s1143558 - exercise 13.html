<!DOCTYPE html>
<html>
<head>
<style> 

.box-one {
  width: 100px;
  height: 100px;
  background-color: pink;
  transition: width 2s;
   margin-bottom: 20px;
}

.box-one:hover {
  width: 300px;
}

.box-two {
  width: 100px;
  height: 100px;
  background-color: pink;
  transition: width 2s, height 4s;
  }
  
.box-two:hover {
  width: 200px;
  height: 200px;
}
  
</style>
</head>
<body>


<div class = "box-one"><p1>1</p1></div>
<div class = "box-two"><p2>2</p2></div>
</body>
</html>
